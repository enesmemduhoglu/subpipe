# subpipe yapılandırması
# Tüm ayarlar burada. Stil/kısıt değişikliği sadece `ass` + `render` aşamalarını
# tetikler; transkripsiyon ve çeviri cache'ten gelir.

source_language: en
target_language: tr

# Ekranda hangi dil üstte ve vurgulu olsun.
# "tr" = Türkçe üstte ve vurgulu, İngilizce altta destek satırı.
primary_language: tr

audio:
  sample_rate: 16000
  channels: 1

transcribe:
  # fal.ai endpoint'i.
  # DİKKAT: fal-ai/wizper KULLANMA. Wizper `chunk_level` için sadece "segment"
  # kabul ediyor ve pratikte tüm videoyu TEK chunk olarak döndürüyor
  # (31 sn'lik test videosunda tek cue, 390 karakter) — altyazı için kullanılamaz.
  # Kelime seviyesi timestamp veren endpoint fal-ai/whisper.
  model: fal-ai/whisper
  # "word" ŞART — segment.py kelime timestamp'leri üzerine kurulu.
  chunk_level: word
  version: "3"
  # Whisper'a özel isim / terim ipucu. Videoda geçen Türkçe isimleri ve marka
  # adlarını buraya yaz; yanlış duymasını azaltır ("Fatih Efe" -> "Fatife").
  prompt: "Fatih Efe, Furkan"
  # prompt GARANTİ DEĞİL — aynı ismin bir geçişini düzeltip diğerini kaçırabiliyor.
  # Transkriptte gördüğün hataları buraya yaz; deterministik olarak düzeltilir.
  replacements:
    Fatife: Fatih Efe

# 9:16 dikey (1080x1920) icin ayarlanmis cue kisitlari.
# Yatay 16:9'a geçersen max_chars_per_line'ı 42'ye çıkar.
cues:
  # Punto buyudukce satir kisalmali; 1080 genislikte 74 punto TR icin
  # 28 karakter ust sinir (ass.py:check_line_width uyarir). 26 guvenli pay birakir.
  max_chars_per_line: 26
  max_lines: 2
  min_duration: 0.85
  max_duration: 7.0
  # 17 Netflix yatay standardı; sosyal medyada konuşma hızlı ve 17 çok
  # parçalı cue üretiyor. 20 okunabilirlikle akıcılık arasında denge.
  max_cps_en: 20.0
  max_cps_tr: 20.0
  min_gap: 0.08
  # Bu süreden uzun boşluk cümle sınırı sayılır
  sentence_pause: 0.6

# Sessizlikte üretilen halüsinasyon cue'ları (hosted ASR'de VAD düğmesi yok)
hallucination:
  patterns:
    - "thanks for watching"
    - "thank you for watching"
    - "please subscribe"
    - "subscribe to my channel"
    - "like and subscribe"
    - "altyazı m.k."
    - "amara.org"
    - "subtitles by"
    - "transcribed by"
    - "www."
  # Aynı metnin arka arkaya bu kadar tekrarı -> ilki hariç at
  max_repeats: 3
  # Bu süreden uzun ama bu kelime sayısından kısa cümleler şüpheli
  long_short_duration: 8.0
  long_short_words: 5

translate:
  model: claude-opus-5
  max_tokens: 16000
  batch_size: 40
  # Batch'e salt-bağlam olarak eklenen komşu cümle sayısı
  context_window: 3
  # Video hakkında bağlam — çeviri kalitesini en çok bu etkiler
  video_context: >-
    Türk takipçilere yönelik bir Instagram İngilizce öğrenme sayfası için hazırlanan
    kısa dikey video (Reels). Hedef kitle A1–B2 seviyesinde, İngilizceyi günlük
    hayatta kullanmak isteyen yetişkinler. İçerik tipik olarak şunlardan biri:
    günlük konuşma kalıpları, durumsal İngilizce (otelde check-in, restoran,
    havalimanı, alışveriş), phrasal verb'ler, sık karıştırılan kelimeler
    (X vs Y) ve hızlı konuşmada kelimelerin birbirine bağlanması.

    KRİTİK: Ekranda İngilizce ve Türkçe altyazı AYNI ANDA görünüyor. İzleyici
    İngilizceyi okuyor, Türkçe ise anlamayı destekleyen yardımcı satır. Yani
    Türkçe metnin işi İngilizceyi ikame etmek değil, onu anlaşılır kılmak.
    İzleyici iki satırı yan yana eşleştirebilmeli.
  tone: >-
    Sen dili, samimi ve doğal konuşma Türkçesi. A1–B2 seviyeye uygun sade kelimeler
    seç; ağdalı, edebi veya resmi yazı diline kaçma.

    İngilizce cümleden uzaklaşma. Doğal Türkçe kur ama serbest yorum yapma, cümleyi
    yeniden kurgulama, kendi eklemeni yapma — izleyici iki satırı eşleştirmeye
    çalışıyor. Tek istisna: birebir çevirisi anlamsız olan deyim ve phrasal verb'ler;
    orada yerleşik Türkçe karşılığı kullan.

    KISA TUT. Türkçe doğal olarak İngilizceden uzun çıkar, ekran alanı ise dar
    (satır başına 30 karakter, en fazla 2 satır). Aynı anlamı daha az kelimeyle
    verebiliyorsan onu seç; gereksiz bağlaç, zamir ve dolgu ifadelerini at.

    Türkçede zaten yerleşmiş İngilizce kelimeleri çevirme (check-in, rezervasyon,
    e-mail, online gibi).
  # Sabit terim sözlüğü — tutarlılık için.
  # Dilbilgisi terimleri İngilizce kalır: sayfa bunları böyle öğretiyor,
  # "yakın geçmiş zaman" demek öğrenciyi kaynaklardan koparır.
  glossary:
    phrasal verb: phrasal verb
    present perfect: present perfect
    past simple: past simple
    present continuous: present continuous
    linking: linking
    small talk: havadan sudan sohbet
    # Videonda geçen ve tutarlı çevrilmesini istediğin terimleri buraya ekle

style:
  # Arial her Windows'ta var ve Türkçe ş ğ ı İ ö ü ç destekler — kutudan çıkar çıkmaz çalışır.
  # Daha iyisi için: .ttf dosyasını assets/fonts/ altına at ve buraya font adını yaz
  # (ör. "Montserrat SemiBold", "Inter SemiBold"). Font bulunamazsa libass SESSİZCE
  # başka bir fonta düşer — render sonrası önizlemeden kontrol et.
  font_name: Arial
  # TR ön planda: üstte, büyük, kalın, beyaz.
  tr:
    fontsize: 74
    primary_colour: "&H00FFFFFF"   # beyaz (ASS: &HAABBGGRR)
    outline_colour: "&H00000000"
    bold: 1
    outline: 4.5
    shadow: 2.0
  # EN destek satırı: altta, daha küçük, sıcak altın sarısı.
  en:
    fontsize: 56
    primary_colour: "&H00A0E0FF"   # altın sarısı (RGB 255,224,160)
    outline_colour: "&H00000000"
    bold: 0
    outline: 3.5
    shadow: 1.0
  # İki dil arasındaki nefes payı — boş satır olarak eklenir
  gap: 48
  # Cue geçişlerini yumuşat (ms); sert kesme yerine yumuşak giriş/çıkış
  fade_in: 130
  fade_out: 130
  margin_l: 80
  margin_r: 80
  # Reels/TikTok alt UI'ı ~250-320px kaplar; 380 güvenli alanın üstünde kalır
  margin_v: 380

render:
  crf: 18
  preset: medium
  # Önizleme: NVENC ile saniyeler içinde biter (GTX 1660 Ti'de mevcut)
  preview_seconds: 60
  preview_encoder: h264_nvenc
  preview_cq: 23
  # Ses yukseklik normalizasyonu (EBU R128, iki gecisli loudnorm).
  # Telefon videolari genelde -24 LUFS civari cikiyor; Instagram/TikTok ~-14 LUFS'a
  # gore karistirildigi icin akista "sesi yok" gibi duruluyor.
  # false yaparsan ses -c:a copy ile aynen gecer (yeniden encode edilmez).
  normalize_audio: true
  target_lufs: -14.0
  target_peak: -1.5
  audio_bitrate: 192k
